name: Deployment pipeline

on:
  push:
    branches: [main]

  pull_request:
      branches: [main]
      types: [opened, synchronize]


jobs:
  check_commit_messages_for_skip:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ contains(join(fromJson(toJson(github.event.commits)).*.message, ' | '), '#skip') }}
        id: check
        run: echo

  simple_deployment_pipeline:
    needs: [check_commit_messages_for_skip]
    runs-on: ubuntu-latest
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install frontend dependencies
        run: npm ci --prefix phonebook-frontend

      - name: install backend dependencies
        run: npm ci --prefix phonebook-backend

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build:backend # This builds the frontend and copies it to the backend

      - name: skip status
        run: echo "$SKIP_STATUS"
        env:
          SKIP_STATUS: ${{ needs.check_commit_messages_for_skip.outputs.status }}

      - name: setup flyctl
        if: ${{ github.event_name == 'push' && needs.check_commit_messages_for_skip.outputs.status != 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: deploy
        if: ${{ github.event_name == 'push' && needs.check_commit_messages_for_skip.outputs.status != 'true' }}
        run: |
          cd phonebook-backend
          flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
